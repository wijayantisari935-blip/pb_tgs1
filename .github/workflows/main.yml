
name: Build C++ Program

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile C++
        shell: pwsh
        run: |
          g++ ProgramNama.cpp -o ProgramNama.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ProgramNama-Windows
          path: ProgramNama.exe
